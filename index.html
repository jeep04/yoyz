<script>
// ══════════════════════════════════════════════════════
//  🔧 ตั้งค่า Firebase (ฟรี — ใช้โปรเจกต์ของตัวเอง)
//  วิธีสร้าง: console.firebase.google.com > สร้างโปรเจกต์
//  > Realtime Database > สร้างฐานข้อมูล (mode: test)
//  > Project settings > Web app > copy firebaseConfig
// ══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyD20tuSfVIW5qu-e-l87nLNrZARed7ewjU",
  authDomain: "jeep04-bbb77.firebaseapp.com",
  databaseURL: "https://jeep04-bbb77-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jeep04-bbb77",
  storageBucket: "jeep04-bbb77.firebasestorage.app",
  messagingSenderId: "139782996517",
  appId: "1:139782996517:web:23b6d8e2359671eae975cc",
  measurementId: "G-13Q1W6RF17"
};

// 🔑 USER_KEY: ใส่ชื่อผู้ใช้ เช่น "jib" เพื่อแยกข้อมูลส่วนตัว
//    (ถ้าใช้คนเดียวใส่ชื่ออะไรก็ได้)
const USER_KEY = "jib";

// ── ตรวจสอบว่า Firebase config ถูกกรอกแล้ว ──
const FIREBASE_READY = firebaseConfig.apiKey !== "YOUR_API_KEY";

let db = null;
if (FIREBASE_READY) {
  try {
    const app = firebase.initializeApp(firebaseConfig);
    db = firebase.database(app);
  } catch(e) { console.warn("Firebase init failed:", e); }
}

// ── Cloud storage helpers ──
async function cloudLoad() {
  // ถ้า Firebase ยังไม่ได้ตั้งค่า → ใช้ localStorage แทน
  if (!db) {
    try {
      const raw = localStorage.getItem('jib_budget_v3_' + USER_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  return new Promise((resolve) => {
    db.ref('budgets/' + USER_KEY).once('value', snap => {
      resolve(snap.exists() ? snap.val() : null);
    }, () => resolve(null));
  });
}

async function cloudSave(data) {
  if (!db) {
    try { localStorage.setItem('jib_budget_v3_' + USER_KEY, JSON.stringify(data)); } catch {}
    return true;
  }
  return new Promise((resolve) => {
    db.ref('budgets/' + USER_KEY).set(data, err => resolve(!err));
  });
}

// ── Cloud storage helpers สำหรับหน้า "รายการผ่อน" (เก็บแยกจากข้อมูลหลัก) ──
async function cloudLoadInstallments() {
  if (!db) {
    try {
      const raw = localStorage.getItem('jib_installments_v1_' + USER_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  return new Promise((resolve) => {
    db.ref('installments/' + USER_KEY).once('value', snap => {
      resolve(snap.exists() ? snap.val() : null);
    }, () => resolve(null));
  });
}

async function cloudSaveInstallments(data) {
  if (!db) {
    try { localStorage.setItem('jib_installments_v1_' + USER_KEY, JSON.stringify(data)); } catch {}
    return true;
  }
  return new Promise((resolve) => {
    db.ref('installments/' + USER_KEY).set(data, err => resolve(!err));
  });
}

// ── Cloud storage helpers สำหรับหน้า "ทรัพย์สิน" (เงิน + ทอง) ──
async function cloudLoadAssets() {
  if (!db) {
    try {
      const raw = localStorage.getItem('jib_assets_v1_' + USER_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  return new Promise((resolve) => {
    db.ref('assets/' + USER_KEY).once('value', snap => {
      resolve(snap.exists() ? snap.val() : null);
    }, () => resolve(null));
  });
}

async function cloudSaveAssets(data) {
  if (!db) {
    try { localStorage.setItem('jib_assets_v1_' + USER_KEY, JSON.stringify(data)); } catch {}
    return true;
  }
  return new Promise((resolve) => {
    db.ref('assets/' + USER_KEY).set(data, err => resolve(!err));
  });
}

// ── ดึงราคาทองคำปัจจุบัน (สมาคมค้าทองคำไทย) ──
async function fetchGoldPrice() {
  const res = await fetch('https://api.chnwt.dev/thai-gold-api/latest');
  if (!res.ok) throw new Error('bad response');
  const json = await res.json();
  if (json.status !== 'success') throw new Error('api error');
  const num = (s) => parseFloat(String(s).replace(/,/g, '')) || 0;
  return {
    barBuy: num(json.response.price.gold_bar.buy),
    barSell: num(json.response.price.gold_bar.sell),
    jewelryBuy: num(json.response.price.gold.buy),
    jewelrySell: num(json.response.price.gold.sell),
    updateDate: json.response.update_date,
    updateTime: json.response.update_time,
  };
}

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

const DEFAULTS = {
  grossSalary: 37000,
  netSalary: 33400,
  monthlyExpenses: [
    { id: 1, name: 'ที่บ้าน ไฟ เน็ต', amount: 3000 },
    { id: 2, name: 'น้ำมันรถยนต์', amount: 3000 },
    { id: 3, name: 'โทรศัพท์', amount: 1200 },
  ],
  schoolName: 'โรงเรียนบีคอนเฮาส์แย้มสะอาด',
  tuitionPerTerm: 72750,
  busPerTerm: 13000,
  termsPerYear: 2,
  subsidies: [
    { id: 1, name: 'BTS ช่วย', amount: 10000 },
    { id: 2, name: 'พี่ผึ้ง ช่วย', amount: 10000 },
  ],
  selectedSaving: 15000,
  scenarios: [15000, 18000, 20000],
  tuitionGoalTarget: 151500,
  tuitionSaved: 0,
};

// ── Toast Component ──
function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-sm font-medium border border-slate-700 animate-bounce">
      <span className="text-emerald-400 text-base">✓</span>
      <span>{msg}</span>
    </div>
  );
}

// ── Setup Banner ──
function SetupBanner() {
  const [open, setOpen] = useState(false);
  if (FIREBASE_READY) return null;
  return (
    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4">
      <div className="flex items-start gap-3">
        <span className="text-2xl mt-0.5">⚠️</span>
        <div className="flex-1 min-w-0">
          <p className="text-sm font-bold text-amber-800">โหมดออฟไลน์ — ข้อมูลบันทึกในเครื่องนี้เท่านั้น</p>
          <p className="text-xs text-amber-700 mt-1">เพื่อบันทึกออนไลน์ข้ามอุปกรณ์ได้ ต้องตั้งค่า Firebase ก่อน</p>
          <button onClick={() => setOpen(!open)} className="text-xs text-amber-800 underline mt-1 font-semibold">
            {open ? '▲ ซ่อนวิธีตั้งค่า' : '▼ ดูวิธีตั้งค่า Firebase (ฟรี)'}
          </button>
          {open && (
            <div className="mt-3 bg-amber-100/80 rounded-xl p-3 text-xs text-amber-900 space-y-1.5 font-mono leading-relaxed">
              <p className="font-bold text-amber-800 font-sans">วิธีตั้งค่า Firebase Realtime Database (ฟรี):</p>
              <p>1. ไปที่ <a href="https://console.firebase.google.com" target="_blank" className="underline text-blue-700">console.firebase.google.com</a></p>
              <p>2. สร้างโปรเจกต์ใหม่ (Add project)</p>
              <p>3. ไปที่ Build → Realtime Database → Create database</p>
              <p>4. เลือก "Start in test mode" → Next</p>
              <p>5. ไปที่ Project Settings (⚙️) → Your apps → เพิ่ม Web app</p>
              <p>6. Copy firebaseConfig ที่ได้ไปวางแทนใน <code className="bg-amber-200 px-1 rounded">firebaseConfig</code> บรรทัดที่ 60</p>
              <p>7. แก้ไข <code className="bg-amber-200 px-1 rounded">USER_KEY</code> เป็นชื่อที่ต้องการ เช่น <code className="bg-amber-200 px-1 rounded">"jib"</code></p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Main App ──
function App() {
  const [page, setPage] = useState('home'); // 'home' | 'installments' | 'assets'
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [toast, setToast] = useState('');

  // State
  const [grossSalary, setGrossSalary]         = useState(DEFAULTS.grossSalary);
  const [netSalary, setNetSalary]             = useState(DEFAULTS.netSalary);
  const [monthlyExpenses, setMonthlyExpenses] = useState(DEFAULTS.monthlyExpenses);
  const [schoolName, setSchoolName]           = useState(DEFAULTS.schoolName);
  const [tuitionPerTerm, setTuitionPerTerm]   = useState(DEFAULTS.tuitionPerTerm);
  const [busPerTerm, setBusPerTerm]           = useState(DEFAULTS.busPerTerm);
  const [termsPerYear, setTermsPerYear]       = useState(DEFAULTS.termsPerYear);
  const [subsidies, setSubsidies]             = useState(DEFAULTS.subsidies);
  const [selectedSaving, setSelectedSaving]   = useState(DEFAULTS.selectedSaving);
  const [scenarios, setScenarios]             = useState(DEFAULTS.scenarios);
  const [tuitionGoalTarget, setTuitionGoalTarget] = useState(DEFAULTS.tuitionGoalTarget);
  const [tuitionSaved, setTuitionSaved]       = useState(DEFAULTS.tuitionSaved);

  // Form states
  const [newExpName, setNewExpName]   = useState('');
  const [newExpAmt, setNewExpAmt]     = useState('');
  const [newSubName, setNewSubName]   = useState('');
  const [newSubAmt, setNewSubAmt]     = useState('');
  const [newScenAmt, setNewScenAmt]   = useState('');

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 3200);
  };

  // Load data on mount
  useEffect(() => {
    cloudLoad().then(data => {
      if (data) {
        if (data.grossSalary !== undefined)      setGrossSalary(data.grossSalary);
        if (data.netSalary !== undefined)        setNetSalary(data.netSalary);
        if (data.monthlyExpenses)                setMonthlyExpenses(data.monthlyExpenses);
        if (data.schoolName)                     setSchoolName(data.schoolName);
        if (data.tuitionPerTerm !== undefined)   setTuitionPerTerm(data.tuitionPerTerm);
        if (data.busPerTerm !== undefined)       setBusPerTerm(data.busPerTerm);
        if (data.termsPerYear !== undefined)     setTermsPerYear(data.termsPerYear);
        if (data.subsidies)                      setSubsidies(data.subsidies);
        if (data.selectedSaving !== undefined)   setSelectedSaving(data.selectedSaving);
        if (data.scenarios)                      setScenarios(data.scenarios);
        if (data.tuitionGoalTarget !== undefined) setTuitionGoalTarget(data.tuitionGoalTarget);
        if (data.tuitionSaved !== undefined)     setTuitionSaved(data.tuitionSaved);
        if (data._savedAt)                       setLastSaved(data._savedAt);
      }
      setLoaded(true);
    });
  }, []);

  const getDataToSave = () => ({
    grossSalary, netSalary, monthlyExpenses,
    schoolName, tuitionPerTerm, busPerTerm, termsPerYear,
    subsidies, selectedSaving, scenarios,
    tuitionGoalTarget, tuitionSaved,
    _savedAt: new Date().toLocaleString('th-TH'),
  });

  const handleSave = async () => {
    setSaving(true);
    const ok = await cloudSave(getDataToSave());
    setSaving(false);
    const now = new Date().toLocaleString('th-TH');
    setLastSaved(now);
    showToast(ok
      ? (FIREBASE_READY ? '☁️ บันทึกออนไลน์เรียบร้อย!' : '💾 บันทึกในเครื่องเรียบร้อย!')
      : '❌ บันทึกไม่สำเร็จ กรุณาลองใหม่');
  };

  const handleReset = () => {
    if (!window.confirm('รีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้น?')) return;
    setGrossSalary(DEFAULTS.grossSalary);
    setNetSalary(DEFAULTS.netSalary);
    setMonthlyExpenses(DEFAULTS.monthlyExpenses);
    setSchoolName(DEFAULTS.schoolName);
    setTuitionPerTerm(DEFAULTS.tuitionPerTerm);
    setBusPerTerm(DEFAULTS.busPerTerm);
    setTermsPerYear(DEFAULTS.termsPerYear);
    setSubsidies(DEFAULTS.subsidies);
    setSelectedSaving(DEFAULTS.selectedSaving);
    setScenarios(DEFAULTS.scenarios);
    setTuitionGoalTarget(DEFAULTS.tuitionGoalTarget);
    setTuitionSaved(DEFAULTS.tuitionSaved);
    showToast('🔄 รีเซ็ตข้อมูลแล้ว');
  };

  const copyReport = () => {
    const text = [
      '=== สรุปแผนการเงินคุณจิ๊บ ===',
      `เงินเดือนสุทธิ: ฿${netSalary.toLocaleString()}`,
      `ค่าใช้จ่ายรายเดือน: ฿${totalExp.toLocaleString()}`,
      `โรงเรียน: ${schoolName}`,
      `ค่าเทอมสุทธิ/ปี: ฿${netTuitionYr.toLocaleString()} (เฉลี่ย ฿${Math.round(netTuitionYr/12).toLocaleString()}/เดือน)`,
      `แผนออม: ฿${selectedSaving.toLocaleString()}/เดือน (฿${annualSavings.toLocaleString()}/ปี)`,
      `สถานะ: ${isCovered ? '✅ ครอบคลุมแล้ว' : `❌ ขาดอีก ฿${Math.abs(surplus).toLocaleString()}`}`,
      `เงินเหลือส่วนตัว: ฿${remaining.toLocaleString()}/เดือน`,
    ].join('\n');
    navigator.clipboard.writeText(text).then(
      () => showToast('📋 คัดลอกรายงานแล้ว!'),
      () => showToast('❌ คัดลอกไม่ได้ในเบราว์เซอร์นี้')
    );
  };

  // ── Calculations ──
  const totalExp        = useMemo(() => monthlyExpenses.reduce((s,i)=>s+i.amount,0), [monthlyExpenses]);
  const totalSchoolYr   = useMemo(() => (tuitionPerTerm+busPerTerm)*termsPerYear, [tuitionPerTerm,busPerTerm,termsPerYear]);
  const totalSubYr      = useMemo(() => subsidies.reduce((s,i)=>s+i.amount,0), [subsidies]);
  const netTuitionYr    = useMemo(() => Math.max(totalSchoolYr-totalSubYr,0), [totalSchoolYr,totalSubYr]);
  const annualSavings   = selectedSaving * 12;
  const isCovered       = annualSavings >= netTuitionYr;
  const surplus         = annualSavings - netTuitionYr;
  const remaining       = netSalary - totalExp - selectedSaving;
  const goalPct         = tuitionGoalTarget > 0 ? Math.min((tuitionSaved/tuitionGoalTarget)*100, 100) : 0;
  const goalRem         = Math.max(tuitionGoalTarget - tuitionSaved, 0);
  const goalReached     = goalRem <= 0 && tuitionGoalTarget > 0;
  const monthsToGoal    = selectedSaving > 0 ? Math.ceil(goalRem/selectedSaving) : null;

  const remColor = remaining >= 10000 ? 'text-emerald-700' : remaining > 0 ? 'text-amber-700' : 'text-rose-700';
  const remBg    = remaining >= 10000 ? 'bg-emerald-50 border-emerald-200' : remaining > 0 ? 'bg-amber-50 border-amber-200' : 'bg-rose-50 border-rose-200';

  if (!loaded) return (
    <div className="flex flex-col items-center justify-center min-h-screen gap-4 bg-slate-50">
      <div className="text-5xl animate-spin">⏳</div>
      <p className="text-slate-500 font-medium">กำลังโหลดข้อมูล{FIREBASE_READY ? 'จากคลาวด์' : ''}...</p>
    </div>
  );

  if (page === 'installments') {
    return <InstallmentPage onBack={() => setPage('home')} />;
  }

  if (page === 'assets') {
    return <AssetsPage onBack={() => setPage('home')} />;
  }

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800" style={{fontFamily:"'Sarabun',sans-serif"}}>
      <Toast msg={toast} />

      {/* ── HEADER ── */}
      <header className="bg-gradient-to-r from-emerald-600 via-teal-700 to-indigo-800 text-white shadow-xl">
        <div className="max-w-6xl mx-auto px-4 py-5 sm:px-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex flex-wrap gap-2 mb-1.5">
                <span className="bg-emerald-500/30 border border-emerald-400/20 text-emerald-200 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">วางแผนการเงิน</span>
                <span className="bg-indigo-500/30 border border-indigo-400/20 text-indigo-200 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">สำหรับบุตรหลาน</span>
                <span className={`${FIREBASE_READY?'bg-emerald-400/20 border-emerald-400/20 text-emerald-200':'bg-amber-400/20 border-amber-400/20 text-amber-200'} border text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider`}>
                  {FIREBASE_READY ? '☁️ ออนไลน์' : '💾 ออฟไลน์'}
                </span>
              </div>
              <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight flex items-center gap-2">
                💰 แดชบอร์ดค่าใช้จ่าย & วางแผนค่าเทอม คุณจิ๊บ
              </h1>
              <p className="text-emerald-100 text-xs mt-1 max-w-xl">
                สำหรับ <strong className="underline decoration-wavy decoration-emerald-300">{schoolName}</strong>
                {lastSaved && <span className="ml-2 text-emerald-300/70">· บันทึกล่าสุด: {lastSaved}</span>}
              </p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={() => setPage('assets')}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-yellow-400 hover:bg-yellow-300 active:scale-95 transition-all rounded-xl text-sm font-bold text-slate-900 shadow-md">
                💎 ทรัพย์สิน
              </button>
              <button onClick={() => setPage('installments')}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-amber-400 hover:bg-amber-300 active:scale-95 transition-all rounded-xl text-sm font-bold text-slate-900 shadow-md">
                📦 รายการผ่อน
              </button>
              <button onClick={handleSave} disabled={saving}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-white/15 hover:bg-white/25 backdrop-blur border border-white/20 active:scale-95 transition-all rounded-xl text-sm font-bold text-white disabled:opacity-60 shadow-md">
                {saving ? '⏳ กำลังบันทึก...' : `${FIREBASE_READY?'☁️':'💾'} บันทึกข้อมูล`}

// ── Helper: ย่อรูปภาพก่อนเก็บ (จำกัดความกว้างไม่เกิน 640px เพื่อประหยัดพื้นที่) ──
function resizeImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ── สร้างตารางผ่อนเริ่มต้น: แบ่งยอดรวมเท่าๆ กันตามจำนวนเดือน (เศษไปรวมงวดสุดท้าย) ──
function buildSchedule(totalPrice, months) {
  const m = Math.max(1, +months || 1);
  const base = Math.floor(totalPrice / m);
  const remainder = totalPrice - base * m;
  const arr = [];
  for (let i = 0; i < m; i++) {
    arr.push({ amount: base + (i === m - 1 ? remainder : 0), paid: false });
  }
  return arr;
}

// ── มั่นใจว่ารายการมีตารางผ่อน (รองรับข้อมูลเก่าที่ยังไม่มี schedule) ──
function ensureSchedule(item) {
  if (Array.isArray(item.schedule) && item.schedule.length === item.months) return item.schedule;
  const sched = buildSchedule(item.totalPrice, item.months);
  const paidCount = Math.min(item.paidMonths || 0, item.months);
  for (let i = 0; i < paidCount; i++) sched[i].paid = true;
  return sched;
}

function AddInstallmentForm({ onAdd }) {

  const [image, setImage]   = useState(null);
  const [busy, setBusy]     = useState(false);

  const handleImage = async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setBusy(true);
    try {
      const dataUrl = await resizeImageFile(file);
      setImage(dataUrl);
    } catch { /* ignore */ }
    setBusy(false);
  };

  const submit = () => {
    const p = +price;
    const m = +months;
    if (!name.trim() || !(p > 0) || !(m >= 1)) return;
    onAdd({ id: Date.now(), name: name.trim(), totalPrice: p, months: m, image, schedule: buildSchedule(p, m) });
    setName(''); setPrice(''); setMonths(3); setImage(null);

  return (
    <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4">

                    if (row.paid) running += (+row.amount || 0);
                    const isCurrent = !row.paid && nextDue === row;
                    return (
                      <tr key={idx} className={isCurrent ? 'bg-amber-50/60' : ''}>
                        <td className="py-1.5 px-3 font-semibold text-slate-700">
                          {idx + 1}{isCurrent && <span className="ml-1 text-[9px] text-amber-600 font-bold">◀ งวดนี้</span>}
                        </td>
                        <td className="py-1.5 px-3">
                          <input type="number" min="0" value={row.amount}
                            onChange={e => onUpdateAmount(idx, +e.target.value || 0)}
                            className="w-24 px-2 py-1 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-400 focus:border-transparent" />
                        </td>
                        <td className="py-1.5 px-3 text-center">
                          <button onClick={() => onToggleRow(idx)}
                            className={`text-[10px] font-bold px-2.5 py-1 rounded-full transition-all ${row.paid ? 'bg-emerald-100 text-emerald-700 hover:bg-emerald-200' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}>
                            {row.paid ? '✓ จ่ายแล้ว' : 'ยังไม่จ่าย'}
                          </button>
                        </td>
                        <td className="py-1.5 px-3 text-right text-slate-500">฿{running.toLocaleString()}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
            <p className="text-[10px] text-slate-400 mt-1.5 italic">* คลิกสถานะเพื่อสลับจ่ายแล้ว/ยังไม่จ่าย และแก้ไขจำนวนเงินแต่ละงวดได้โดยตรง</p>
          </div>

          <div className="flex gap-2 pt-1">
            <button onClick={() => { onDelete(item.id); onClose(); }}
              className="text-xs font-bold px-4 py-2.5 rounded-xl border border-rose-200 text-rose-600 hover:bg-rose-50 transition-all">
              🗑️ ลบรายการนี้
            </button>
            <button onClick={onClose}
              className="ml-auto text-xs font-bold px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white transition-all shadow-sm">
              เสร็จสิ้น
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}


function InstallmentPage({ onBack }) {
  const [loaded, setLoaded]   = useState(false);
  const [saving, setSaving]   = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [toast, setToast]     = useState('');
  const [items, setItems]     = useState(INSTALLMENT_DEFAULTS.items);
  const [detailItemId, setDetailItemId] = useState(null);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); };

  useEffect(() => {
    cloudLoadInstallments().then(data => {
      if (data && Array.isArray(data.items)) {
        setItems(data.items.map(i => ({ ...i, schedule: ensureSchedule(i) })));
      }
      if (data && data._savedAt) setLastSaved(data._savedAt);
      setLoaded(true);
    });
  }, []);

  const handleSave = async () => {
    setSaving(true);
    const now = new Date().toLocaleString('th-TH');
    const ok = await cloudSaveInstallments({ items, _savedAt: now });
    setSaving(false);
    setLastSaved(now);
    showToast(ok
      ? (FIREBASE_READY ? '☁️ บันทึกออนไลน์เรียบร้อย!' : '💾 บันทึกในเครื่องเรียบร้อย!')
      : '❌ บันทึกไม่สำเร็จ กรุณาลองใหม่');
  };

  const addItem = (item) => { setItems(prev => [...prev, item]); showToast('➕ เพิ่มสินค้าแล้ว'); };
  const deleteItem = (id) => {
    if (!window.confirm('ลบรายการผ่อนนี้?')) return;
    setItems(prev => prev.filter(i => i.id !== id));
  };
  const payMonth = (id) => setItems(prev => prev.map(i => {
    if (i.id !== id) return i;
    const schedule = i.schedule.map(r => ({ ...r }));
    const idx = schedule.findIndex(r => !r.paid);
    if (idx === -1) return i;
    schedule[idx].paid = true;
    return { ...i, schedule };
  }));
  const unpayMonth = (id) => setItems(prev => prev.map(i => {
    if (i.id !== id) return i;
    const schedule = i.schedule.map(r => ({ ...r }));
    let idx = -1;
    for (let j = schedule.length - 1; j >= 0; j--) { if (schedule[j].paid) { idx = j; break; } }
    if (idx === -1) return i;
    schedule[idx].paid = false;
    return { ...i, schedule };
  }));
  const toggleRow = (itemId, rowIdx) => setItems(prev => prev.map(i => {
    if (i.id !== itemId) return i;
    const schedule = i.schedule.map((r, idx) => idx === rowIdx ? { ...r, paid: !r.paid } : r);
    return { ...i, schedule };
  }));
  const updateRowAmount = (itemId, rowIdx, amount) => setItems(prev => prev.map(i => {
    if (i.id !== itemId) return i;
    const schedule = i.schedule.map((r, idx) => idx === rowIdx ? { ...r, amount } : r);
    return { ...i, schedule };
  }));

  // ── Dashboard calculations ──
  const totalItems    = items.length;
  const totalValue    = useMemo(() => items.reduce((s, i) => s + i.totalPrice, 0), [items]);
  const totalPaid     = useMemo(() => items.reduce((s, i) =>
    s + (i.schedule || []).reduce((ss, r) => ss + (r.paid ? (+r.amount || 0) : 0), 0), 0), [items]);
  const totalRemaining = Math.max(totalValue - totalPaid, 0);
  const monthlyTotal   = useMemo(() => items.reduce((s, i) => {
    const nextRow = (i.schedule || []).find(r => !r.paid);
    return s + (nextRow ? (+nextRow.amount || 0) : 0);
  }, 0), [items]);
  const doneCount = items.filter(i => (i.schedule || []).length > 0 && (i.schedule || []).every(r => r.paid)).length;
  const overallPct = totalValue > 0 ? Math.min((totalPaid / totalValue) * 100, 100) : 0;
  const detailItem = detailItemId ? items.find(i => i.id === detailItemId) : null;

  if (!loaded) return (
    <div className="flex flex-col items-center justify-center min-h-screen gap-4 bg-slate-50">
      <div className="text-5xl animate-spin">⏳</div>
      <p className="text-slate-500 font-medium">กำลังโหลดข้อมูล{FIREBASE_READY ? 'จากคลาวด์' : ''}...</p>
    </div>
  );

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800" style={{ fontFamily: "'Sarabun',sans-serif" }}>
      <Toast msg={toast} />

      {/* ── HEADER ── */}
      <header className="bg-gradient-to-r from-amber-500 via-orange-600 to-indigo-800 text-white shadow-xl">
        <div className="max-w-6xl mx-auto px-4 py-5 sm:px-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex flex-wrap gap-2 mb-1.5">
                <span className="bg-white/20 border border-white/20 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">รายการผ่อน</span>
                <span className={`${FIREBASE_READY ? 'bg-emerald-400/20 border-emerald-400/20 text-emerald-100' : 'bg-amber-900/20 border-amber-900/20 text-amber-100'} border text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider`}>
                  {FIREBASE_READY ? '☁️ ออนไลน์' : '💾 ออฟไลน์'}
                </span>
              </div>
              <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight flex items-center gap-2">📦 รายการผ่อนสินค้า</h1>
              <p className="text-amber-100 text-xs mt-1 max-w-xl">
                ติดตามสินค้าที่กำลังผ่อนทั้งหมดในที่เดียว
                {lastSaved && <span className="ml-2 text-amber-100/70">· บันทึกล่าสุด: {lastSaved}</span>}
              </p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={onBack}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-white/15 hover:bg-white/25 backdrop-blur border border-white/20 active:scale-95 transition-all rounded-xl text-sm font-bold text-white shadow-md">
                ⬅ กลับหน้าแดชบอร์ด
              </button>
              <button onClick={handleSave} disabled={saving}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-white/15 hover:bg-white/25 backdrop-blur border border-white/20 active:scale-95 transition-all rounded-xl text-sm font-bold text-white disabled:opacity-60 shadow-md">
                {saving ? '⏳ กำลังบันทึก...' : `${FIREBASE_READY ? '☁️' : '💾'} บันทึกข้อมูล`}
              </button>
            </div>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-5 sm:px-6 space-y-5">

        {/* ── DASHBOARD SUMMARY ── */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">จำนวนสินค้าที่ผ่อน</span>
            <span className="text-xl sm:text-2xl font-extrabold text-slate-900 block mt-0.5">{totalItems} รายการ</span>
            <span className="text-[10px] text-emerald-600 font-medium">ผ่อนครบแล้ว {doneCount} รายการ</span>
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">ยอดผ่อนรวมทั้งหมด</span>
            <span className="text-xl sm:text-2xl font-extrabold text-indigo-700 block mt-0.5">฿{totalValue.toLocaleString()}</span>
            <span className="text-[10px] text-slate-400">ผ่านไปแล้ว {Math.round(overallPct)}%</span>
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">ต้องจ่ายรวม/เดือนนี้</span>
            <span className="text-xl sm:text-2xl font-extrabold text-rose-600 block mt-0.5">฿{Math.round(monthlyTotal).toLocaleString()}</span>
            <span className="text-[10px] text-slate-400">จากรายการที่ยังผ่อนไม่ครบ</span>
          </div>
          <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-4">
            <span className="text-[10px] font-semibold uppercase tracking-wider block text-emerald-700">ผ่อนไปแล้ว / คงเหลือ</span>
            <span className="text-xl sm:text-2xl font-extrabold text-emerald-700 block mt-0.5">฿{totalPaid.toLocaleString()}</span>
            <span className="text-[10px] text-rose-600 font-medium">คงเหลือ ฿{totalRemaining.toLocaleString()}</span>
          </div>
        </div>

        {/* ── OVERALL PROGRESS ── */}
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4">
          <h2 className="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2.5 mb-3.5">
            <span className="text-amber-500">📊</span>ความคืบหน้าการผ่อนทั้งหมด
          </h2>
          <div className="w-full h-4 bg-slate-100 rounded-full overflow-hidden mb-2">
            <div className="h-full rounded-full bg-gradient-to-r from-amber-400 via-orange-500 to-indigo-600 transition-all duration-700" style={{ width: `${overallPct}%` }} />
          </div>
          <div className="flex justify-between text-xs text-slate-500">
            <span className="font-extrabold text-slate-800 text-sm">{Math.round(overallPct)}%</span>
            <span>ผ่อนแล้ว ฿{totalPaid.toLocaleString()} จาก ฿{totalValue.toLocaleString()}</span>
          </div>
        </div>

        {/* ── ADD ITEM FORM ── */}
        <AddInstallmentForm onAdd={addItem} />

        {/* ── ITEM LIST ── */}
        <div>
          <h2 className="text-sm font-bold text-slate-900 flex items-center gap-2 mb-3">
            <span className="text-indigo-600">🗂️</span>รายการสินค้าที่กำลังผ่อน
          </h2>
          {items.length === 0 ? (
            <div className="bg-white rounded-2xl border border-dashed border-slate-300 p-8 text-center text-slate-400 text-sm">
              ยังไม่มีรายการผ่อน — เพิ่มสินค้ารายการแรกได้ที่ฟอร์มด้านบน
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {items.map(item => (
                <InstallmentCard key={item.id} item={item} onDelete={deleteItem} onPay={payMonth} onUnpay={unpayMonth} onOpenDetail={setDetailItemId} />
              ))}
            </div>
          )}
        </div>

        {/* ── SAVE REMINDER BAR ── */}
        <div className="bg-gradient-to-r from-amber-50 to-indigo-50 border border-amber-100 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div className="flex items-start sm:items-center gap-3">
            <span className="text-2xl flex-shrink-0">{FIREBASE_READY ? '☁️' : '💾'}</span>
            <div>
              <p className="text-sm font-bold text-indigo-800">{FIREBASE_READY ? 'บันทึกออนไลน์' : 'บันทึกในเครื่อง'}</p>
              <p className="text-xs text-indigo-600">แก้ไขข้อมูลแล้ว? กด "บันทึกข้อมูล" เพื่อเซฟ
                {lastSaved && <span className="ml-1 text-indigo-400">· บันทึกล่าสุด: {lastSaved}</span>}
              </p>
            </div>
          </div>
          <button onClick={handleSave} disabled={saving}
            className="flex-shrink-0 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-bold px-6 py-2.5 rounded-xl transition-all disabled:opacity-60 shadow-md shadow-indigo-200">
            {saving ? '⏳ กำลังบันทึก...' : `${FIREBASE_READY ? '☁️' : '💾'} บันทึกข้อมูล`}
          </button>
        </div>

      </main>

      <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-6 border-t border-slate-800">
        <div className="max-w-6xl mx-auto px-4 text-center space-y-2">
          <p className="font-semibold text-slate-300">📦 รายการผ่อนสินค้า</p>
          <p className="text-[11px] text-slate-500">
            {FIREBASE_READY
              ? '☁️ ข้อมูลบันทึกออนไลน์ผ่าน Firebase · สามารถเข้าถึงได้ทุกอุปกรณ์'
              : '⚠️ โหมดออฟไลน์ · ข้อมูลบันทึกในเบราว์เซอร์นี้เท่านั้น'}
          </p>
        </div>
      </footer>

      {detailItem && (
        <InstallmentDetailModal
          item={detailItem}
          onClose={() => setDetailItemId(null)}
          onToggleRow={(rowIdx) => toggleRow(detailItem.id, rowIdx)}
          onUpdateAmount={(rowIdx, amount) => updateRowAmount(detailItem.id, rowIdx, amount)}
          onDelete={deleteItem}
        />
      )}
    </div>
  );
}

    <div className="flex gap-1.5">

        className="w-24 text-xs border border-slate-200 rounded-xl px-2 py-2 outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition-all text-center" />
      <button onClick={submit}
        className="bg-emerald-500 hover:bg-emerald-400 active:scale-95 text-white text-xs px-3 py-2 rounded-xl font-bold transition-all whitespace-nowrap">+ เพิ่ม</button>

  );
}

function AssetsPage({ onBack }) {

  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [toast, setToast] = useState('');

  const [cashItems, setCashItems] = useState(ASSET_DEFAULTS.cashItems);
  const [goldItems, setGoldItems] = useState(ASSET_DEFAULTS.goldItems);
  const [goldPriceBar, setGoldPriceBar] = useState(ASSET_DEFAULTS.goldPriceBar);
  const [goldPriceJewelry, setGoldPriceJewelry] = useState(ASSET_DEFAULTS.goldPriceJewelry);
  const [goldPriceUpdatedText, setGoldPriceUpdatedText] = useState(ASSET_DEFAULTS.goldPriceUpdatedText);
  const [priceLoading, setPriceLoading] = useState(false);
  const [priceError, setPriceError] = useState(false);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(''), 3200); };

  const refreshGoldPrice = async () => {
    setPriceLoading(true);
    setPriceError(false);
    try {
      const p = await fetchGoldPrice();
      setGoldPriceBar(p.barBuy);
      setGoldPriceJewelry(p.jewelryBuy);
      setGoldPriceUpdatedText(`${p.updateDate} ${p.updateTime}`);
      showToast('📈 อัปเดตราคาทองล่าสุดแล้ว');
    } catch (e) {
      setPriceError(true);
    }
    setPriceLoading(false);
  };

  useEffect(() => {
    cloudLoadAssets().then(data => {
      if (data) {
        if (Array.isArray(data.cashItems)) setCashItems(data.cashItems);
        if (Array.isArray(data.goldItems)) setGoldItems(data.goldItems);
        if (data.goldPriceBar) setGoldPriceBar(data.goldPriceBar);
        if (data.goldPriceJewelry) setGoldPriceJewelry(data.goldPriceJewelry);
        if (data.goldPriceUpdatedText) setGoldPriceUpdatedText(data.goldPriceUpdatedText);
        if (data._savedAt) setLastSaved(data._savedAt);
      }
      setLoaded(true);
      refreshGoldPrice();
    });
  }, []);

  const handleSave = async () => {
    setSaving(true);
    const now = new Date().toLocaleString('th-TH');
    const ok = await cloudSaveAssets({ cashItems, goldItems, goldPriceBar, goldPriceJewelry, goldPriceUpdatedText, _savedAt: now });
    setSaving(false);
    setLastSaved(now);
    showToast(ok
      ? (FIREBASE_READY ? '☁️ บันทึกออนไลน์เรียบร้อย!' : '💾 บันทึกในเครื่องเรียบร้อย!')
      : '❌ บันทึกไม่สำเร็จ กรุณาลองใหม่');
  };

  const addCash = (item) => { setCashItems(prev => [...prev, item]); showToast('➕ เพิ่มรายการเงินแล้ว'); };
  const deleteCash = (id) => setCashItems(prev => prev.filter(i => i.id !== id));

  const addGold = (item) => { setGoldItems(prev => [...prev, item]); showToast('➕ เพิ่มรายการทองแล้ว'); };
  const deleteGold = (id) => setGoldItems(prev => prev.filter(i => i.id !== id));

  const handleManualPriceChange = (kind, val) => {
    if (kind === 'bar') setGoldPriceBar(val); else setGoldPriceJewelry(val);
  };

  // ── Calculations ──
  const totalCash = useMemo(() => cashItems.reduce((s, i) => s + (+i.amount || 0), 0), [cashItems]);
  const goldValueOf = (item) => (item.type === 'jewelry' ? goldPriceJewelry : goldPriceBar) * (+item.weight || 0);
  const totalGold = useMemo(() => goldItems.reduce((s, i) => s + goldValueOf(i), 0), [goldItems, goldPriceBar, goldPriceJewelry]);
  const totalGoldWeight = useMemo(() => goldItems.reduce((s, i) => s + (+i.weight || 0), 0), [goldItems]);
  const grandTotal = totalCash + totalGold;
  const cashPct = grandTotal > 0 ? Math.round((totalCash / grandTotal) * 100) : 0;
  const goldPct = grandTotal > 0 ? 100 - cashPct : 0;

  if (!loaded) return (
    <div className="flex flex-col items-center justify-center min-h-screen gap-4 bg-slate-50">
      <div className="text-5xl animate-spin">⏳</div>
      <p className="text-slate-500 font-medium">กำลังโหลดข้อมูล{FIREBASE_READY ? 'จากคลาวด์' : ''}...</p>
    </div>
  );

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800" style={{ fontFamily: "'Sarabun',sans-serif" }}>
      <Toast msg={toast} />

      {/* ── HEADER ── */}
      <header className="bg-gradient-to-r from-yellow-500 via-amber-600 to-indigo-800 text-white shadow-xl">
        <div className="max-w-6xl mx-auto px-4 py-5 sm:px-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex flex-wrap gap-2 mb-1.5">
                <span className="bg-white/20 border border-white/20 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">ทรัพย์สิน</span>
                <span className={`${FIREBASE_READY ? 'bg-emerald-400/20 border-emerald-400/20 text-emerald-100' : 'bg-amber-900/20 border-amber-900/20 text-amber-100'} border text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider`}>
                  {FIREBASE_READY ? '☁️ ออนไลน์' : '💾 ออฟไลน์'}
                </span>
              </div>
              <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight flex items-center gap-2">💎 รวบรวมทรัพย์สิน เงิน & ทอง</h1>
              <p className="text-amber-100 text-xs mt-1 max-w-xl">
                สรุปมูลค่าเงินสดและทองคำทั้งหมดในที่เดียว
                {lastSaved && <span className="ml-2 text-amber-100/70">· บันทึกล่าสุด: {lastSaved}</span>}
              </p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={onBack}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-white/15 hover:bg-white/25 backdrop-blur border border-white/20 active:scale-95 transition-all rounded-xl text-sm font-bold text-white shadow-md">
                ⬅ กลับหน้าแดชบอร์ด
              </button>
              <button onClick={handleSave} disabled={saving}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-white/15 hover:bg-white/25 backdrop-blur border border-white/20 active:scale-95 transition-all rounded-xl text-sm font-bold text-white disabled:opacity-60 shadow-md">
                {saving ? '⏳ กำลังบันทึก...' : `${FIREBASE_READY ? '☁️' : '💾'} บันทึกข้อมูล`}
              </button>
            </div>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-5 sm:px-6 space-y-5">

        {/* ── ยอดรวมใหญ่ ── */}
        <div className="bg-gradient-to-br from-indigo-900 via-slate-900 to-amber-900 rounded-2xl shadow-xl p-6 sm:p-8 text-center text-white">
          <p className="text-xs sm:text-sm font-semibold text-amber-200 uppercase tracking-widest mb-2">มูลค่าทรัพย์สินรวมทั้งหมด</p>
          <p className="text-4xl sm:text-6xl font-extrabold tracking-tight">฿{Math.round(grandTotal).toLocaleString()}</p>
          <div className="flex justify-center gap-4 sm:gap-8 mt-4 text-xs sm:text-sm">
            <span className="text-emerald-300">💵 เงินสด ฿{totalCash.toLocaleString()} ({cashPct}%)</span>
            <span className="text-amber-300">🥇 ทองคำ ฿{Math.round(totalGold).toLocaleString()} ({goldPct}%)</span>
          </div>
          {grandTotal > 0 && (
            <div className="w-full h-2.5 bg-white/10 rounded-full overflow-hidden mt-4 max-w-md mx-auto flex">
              <div className="h-full bg-emerald-400" style={{ width: `${cashPct}%` }} />
              <div className="h-full bg-amber-400" style={{ width: `${goldPct}%` }} />
            </div>
          )}
        </div>

        {/* ── SUMMARY CARDS ── */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">💵 รวมเงินสด</span>
            <span className="text-xl sm:text-2xl font-extrabold text-emerald-700 block mt-0.5">฿{totalCash.toLocaleString()}</span>
            <span className="text-[10px] text-slate-400">{cashItems.length} บัญชี/รายการ</span>
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">🥇 รวมทองคำ</span>
            <span className="text-xl sm:text-2xl font-extrabold text-amber-700 block mt-0.5">฿{Math.round(totalGold).toLocaleString()}</span>
            <span className="text-[10px] text-slate-400">{totalGoldWeight.toLocaleString()} บาททองคำ</span>
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">🥇 ราคาทองแท่ง/บาท</span>
            <span className="text-xl sm:text-2xl font-extrabold text-slate-900 block mt-0.5">฿{goldPriceBar.toLocaleString()}</span>
            <span className="text-[10px] text-slate-400">ราคารับซื้อปัจจุบัน</span>
          </div>
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80">
            <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">📿 ราคาทองรูปพรรณ/บาท</span>
            <span className="text-xl sm:text-2xl font-extrabold text-slate-900 block mt-0.5">฿{goldPriceJewelry.toLocaleString()}</span>
            <span className="text-[10px] text-slate-400">ราคารับซื้อปัจจุบัน</span>
          </div>
        </div>

        {/* ── ราคาทองอ้างอิง ── */}
        <GoldPriceBox
          goldPriceBar={goldPriceBar} goldPriceJewelry={goldPriceJewelry}
          goldPriceUpdatedText={goldPriceUpdatedText} priceLoading={priceLoading} priceError={priceError}
          onRefresh={refreshGoldPrice} onManualChange={handleManualPriceChange}
        />

        <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
          {/* ── เงินสด ── */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4">
            <h2 className="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2.5 mb-3.5">
              <span className="text-emerald-600">💵</span>รายการเงินสด / เงินฝาก
            </h2>
            <div className="space-y-2 mb-3 max-h-64 overflow-y-auto scrollbar-thin">
              {cashItems.map(item => (
                <div key={item.id} className="flex justify-between items-center text-xs bg-slate-50 hover:bg-slate-100 transition-colors rounded-xl px-3 py-2 border border-slate-100">
                  <span className="font-medium text-slate-700 flex-1 min-w-0 truncate">{item.name}</span>
                  <div className="flex items-center gap-2 ml-2 flex-shrink-0">
                    <span className="font-bold text-slate-900">฿{(+item.amount || 0).toLocaleString()}</span>
                    <button onClick={() => deleteCash(item.id)}
                      className="text-slate-300 hover:text-rose-500 transition-colors w-4 h-4 flex items-center justify-center">✕</button>
                  </div>
                </div>
              ))}
              {cashItems.length === 0 && <p className="text-xs text-slate-400 italic text-center py-2">ยังไม่มีรายการเงินสด — เพิ่มรายการแรกด้านล่าง</p>}
            </div>
            <AddCashForm onAdd={addCash} />
            <div className="mt-3 flex justify-between text-xs pt-2.5 border-t border-slate-100">
              <span className="text-slate-500 font-medium">รวมเงินสดทั้งหมด</span>
              <span className="font-extrabold text-emerald-600">฿{totalCash.toLocaleString()}</span>
            </div>
          </div>

          {/* ── ทองคำ ── */}
          <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4">
            <h2 className="text-sm font-bold text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-2.5 mb-3.5">
              <span className="text-amber-500">🥇</span>รายการทองคำ
            </h2>
            <div className="space-y-2 mb-3 max-h-64 overflow-y-auto scrollbar-thin">
              {goldItems.map(item => (
                <div key={item.id} className="flex justify-between items-center text-xs bg-slate-50 hover:bg-slate-100 transition-colors rounded-xl px-3 py-2 border border-slate-100">
                  <div className="flex-1 min-w-0">
                    <span className="font-medium text-slate-700 block truncate">
                      {GOLD_TYPES[item.type]?.emoji} {item.label || GOLD_TYPES[item.type]?.label}
                    </span>
                    <span className="text-[10px] text-slate-400">{item.weight} บาททองคำ · {GOLD_TYPES[item.type]?.label}</span>
                  </div>
                  <div className="flex items-center gap-2 ml-2 flex-shrink-0">
                    <span className="font-bold text-slate-900">฿{Math.round(goldValueOf(item)).toLocaleString()}</span>
                    <button onClick={() => deleteGold(item.id)}
                      className="text-slate-300 hover:text-rose-500 transition-colors w-4 h-4 flex items-center justify-center">✕</button>
                  </div>
                </div>
              ))}
              {goldItems.length === 0 && <p className="text-xs text-slate-400 italic text-center py-2">ยังไม่มีรายการทองคำ — เพิ่มรายการแรกด้านล่าง</p>}
            </div>
            <AddGoldForm onAdd={addGold} />
            <div className="mt-3 flex justify-between text-xs pt-2.5 border-t border-slate-100">
              <span className="text-slate-500 font-medium">รวมทองคำทั้งหมด ({totalGoldWeight.toLocaleString()} บาท)</span>
              <span className="font-extrabold text-amber-600">฿{Math.round(totalGold).toLocaleString()}</span>
            </div>
          </div>
        </div>

        {/* ── SAVE REMINDER BAR ── */}
        <div className="bg-gradient-to-r from-amber-50 to-indigo-50 border border-amber-100 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div className="flex items-start sm:items-center gap-3">
            <span className="text-2xl flex-shrink-0">{FIREBASE_READY ? '☁️' : '💾'}</span>
            <div>
              <p className="text-sm font-bold text-indigo-800">{FIREBASE_READY ? 'บันทึกออนไลน์' : 'บันทึกในเครื่อง'}</p>
              <p className="text-xs text-indigo-600">แก้ไขข้อมูลแล้ว? กด "บันทึกข้อมูล" เพื่อเซฟ
                {lastSaved && <span className="ml-1 text-indigo-400">· บันทึกล่าสุด: {lastSaved}</span>}
              </p>
            </div>
          </div>
          <button onClick={handleSave} disabled={saving}
            className="flex-shrink-0 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-bold px-6 py-2.5 rounded-xl transition-all disabled:opacity-60 shadow-md shadow-indigo-200">
            {saving ? '⏳ กำลังบันทึก...' : `${FIREBASE_READY ? '☁️' : '💾'} บันทึกข้อมูล`}
          </button>
        </div>

      </main>

      <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-6 border-t border-slate-800">
        <div className="max-w-6xl mx-auto px-4 text-center space-y-2">
          <p className="font-semibold text-slate-300">💎 รวบรวมทรัพย์สิน เงิน & ทอง</p>
          <p className="text-[11px] text-slate-500">
            ราคาทองอ้างอิงจากสมาคมค้าทองคำ (goldtraders.or.th) ผ่าน API สาธารณะ อาจคลาดเคลื่อนจากราคาจริง ณ เวลาซื้อขายเล็กน้อย
          </p>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
