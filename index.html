<script>
// ══════════════════════════════════════════════════════
//  🔧 ตั้งค่า Firebase (ฟรี — ใช้โปรเจกต์ของตัวเอง)
//  วิธีสร้าง: console.firebase.google.com > สร้างโปรเจกต์
//  > Realtime Database > สร้างฐานข้อมูล (mode: test)
//  > Project settings > Web app > copy firebaseConfig
// ══════════════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyD20tuSfVIW5qu-e-l87nLNrZARed7ewjU",
  authDomain: "jeep04-bbb77.firebaseapp.com",
  databaseURL: "https://jeep04-bbb77-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "jeep04-bbb77",
  storageBucket: "jeep04-bbb77.firebasestorage.app",
  messagingSenderId: "139782996517",
  appId: "1:139782996517:web:23b6d8e2359671eae975cc",
  measurementId: "G-13Q1W6RF17"
};

// 🔑 USER_KEY: ใส่ชื่อผู้ใช้ เช่น "jib" เพื่อแยกข้อมูลส่วนตัว
//    (ถ้าใช้คนเดียวใส่ชื่ออะไรก็ได้)
const USER_KEY = "jib";

// ── ตรวจสอบว่า Firebase config ถูกกรอกแล้ว ──
const FIREBASE_READY = firebaseConfig.apiKey !== "YOUR_API_KEY";

let db = null;
if (FIREBASE_READY) {
  try {
    const app = firebase.initializeApp(firebaseConfig);
    db = firebase.database(app);
  } catch(e) { console.warn("Firebase init failed:", e); }
}

// ── Cloud storage helpers ──
async function cloudLoad() {
  // ถ้า Firebase ยังไม่ได้ตั้งค่า → ใช้ localStorage แทน
  if (!db) {
    try {
      const raw = localStorage.getItem('jib_budget_v3_' + USER_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }
  return new Promise((resolve) => {
    db.ref('budgets/' + USER_KEY).once('value', snap => {
      resolve(snap.exists() ? snap.val() : null);
    }, () => resolve(null));
  });
}

async function cloudSave(data) {
  if (!db) {
    try { localStorage.setItem('jib_budget_v3_' + USER_KEY, JSON.stringify(data)); } catch {}
    return true;
  }
  return new Promise((resolve) => {
    db.ref('budgets/' + USER_KEY).set(data, err => resolve(!err));
  });
}
</script>

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

const DEFAULTS = {
  grossSalary: 37000,
  netSalary: 33400,
  monthlyExpenses: [
    { id: 1, name: 'ที่บ้าน ไฟ เน็ต', amount: 3000 },
    { id: 2, name: 'น้ำมันรถยนต์', amount: 3000 },
    { id: 3, name: 'โทรศัพท์', amount: 1200 },
  ],
  schoolName: 'โรงเรียนบีคอนเฮาส์แย้มสะอาด',
  tuitionPerTerm: 72750,
  busPerTerm: 13000,
  termsPerYear: 2,
  subsidies: [
    { id: 1, name: 'BTS ช่วย', amount: 10000 },
    { id: 2, name: 'พี่ผึ้ง ช่วย', amount: 10000 },
  ],
  selectedSaving: 15000,
  scenarios: [15000, 18000, 20000],
  tuitionGoalTarget: 151500,
  tuitionSaved: 0,
};

// ── Toast Component ──
function Toast({ msg }) {
  if (!msg) return null;
  return (
    <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-2.5 text-sm font-medium border border-slate-700 animate-bounce">
      <span className="text-emerald-400 text-base">✓</span>
      <span>{msg}</span>
    </div>
  );
}

// ── Setup Banner ──
function SetupBanner() {
  const [open, setOpen] = useState(false);
  if (FIREBASE_READY) return null;
  return (
    <div className="bg-amber-50 border border-amber-200 rounded-2xl p-4 mb-4">
      <div className="flex items-start gap-3">
        <span className="text-2xl mt-0.5">⚠️</span>
        <div className="flex-1 min-w-0">
          <p className="text-sm font-bold text-amber-800">โหมดออฟไลน์ — ข้อมูลบันทึกในเครื่องนี้เท่านั้น</p>
          <p className="text-xs text-amber-700 mt-1">เพื่อบันทึกออนไลน์ข้ามอุปกรณ์ได้ ต้องตั้งค่า Firebase ก่อน</p>
          <button onClick={() => setOpen(!open)} className="text-xs text-amber-800 underline mt-1 font-semibold">
            {open ? '▲ ซ่อนวิธีตั้งค่า' : '▼ ดูวิธีตั้งค่า Firebase (ฟรี)'}
          </button>
          {open && (
            <div className="mt-3 bg-amber-100/80 rounded-xl p-3 text-xs text-amber-900 space-y-1.5 font-mono leading-relaxed">
              <p className="font-bold text-amber-800 font-sans">วิธีตั้งค่า Firebase Realtime Database (ฟรี):</p>
              <p>1. ไปที่ <a href="https://console.firebase.google.com" target="_blank" className="underline text-blue-700">console.firebase.google.com</a></p>
              <p>2. สร้างโปรเจกต์ใหม่ (Add project)</p>
              <p>3. ไปที่ Build → Realtime Database → Create database</p>
              <p>4. เลือก "Start in test mode" → Next</p>
              <p>5. ไปที่ Project Settings (⚙️) → Your apps → เพิ่ม Web app</p>
              <p>6. Copy firebaseConfig ที่ได้ไปวางแทนใน <code className="bg-amber-200 px-1 rounded">firebaseConfig</code> บรรทัดที่ 60</p>
              <p>7. แก้ไข <code className="bg-amber-200 px-1 rounded">USER_KEY</code> เป็นชื่อที่ต้องการ เช่น <code className="bg-amber-200 px-1 rounded">"jib"</code></p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Main App ──
function App() {
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  const [lastSaved, setLastSaved] = useState(null);
  const [toast, setToast] = useState('');

  // State
  const [grossSalary, setGrossSalary]         = useState(DEFAULTS.grossSalary);
  const [netSalary, setNetSalary]             = useState(DEFAULTS.netSalary);
  const [monthlyExpenses, setMonthlyExpenses] = useState(DEFAULTS.monthlyExpenses);
  const [schoolName, setSchoolName]           = useState(DEFAULTS.schoolName);
  const [tuitionPerTerm, setTuitionPerTerm]   = useState(DEFAULTS.tuitionPerTerm);
  const [busPerTerm, setBusPerTerm]           = useState(DEFAULTS.busPerTerm);
  const [termsPerYear, setTermsPerYear]       = useState(DEFAULTS.termsPerYear);
  const [subsidies, setSubsidies]             = useState(DEFAULTS.subsidies);
  const [selectedSaving, setSelectedSaving]   = useState(DEFAULTS.selectedSaving);
  const [scenarios, setScenarios]             = useState(DEFAULTS.scenarios);
  const [tuitionGoalTarget, setTuitionGoalTarget] = useState(DEFAULTS.tuitionGoalTarget);
  const [tuitionSaved, setTuitionSaved]       = useState(DEFAULTS.tuitionSaved);

  // Form states
  const [newExpName, setNewExpName]   = useState('');
  const [newExpAmt, setNewExpAmt]     = useState('');
  const [newSubName, setNewSubName]   = useState('');
  const [newSubAmt, setNewSubAmt]     = useState('');
  const [newScenAmt, setNewScenAmt]   = useState('');

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(''), 3200);
  };

  // Load data on mount
  useEffect(() => {
    cloudLoad().then(data => {
      if (data) {
        if (data.grossSalary !== undefined)      setGrossSalary(data.grossSalary);
        if (data.netSalary !== undefined)        setNetSalary(data.netSalary);
        if (data.monthlyExpenses)                setMonthlyExpenses(data.monthlyExpenses);
        if (data.schoolName)                     setSchoolName(data.schoolName);
        if (data.tuitionPerTerm !== undefined)   setTuitionPerTerm(data.tuitionPerTerm);
        if (data.busPerTerm !== undefined)       setBusPerTerm(data.busPerTerm);
        if (data.termsPerYear !== undefined)     setTermsPerYear(data.termsPerYear);
        if (data.subsidies)                      setSubsidies(data.subsidies);
        if (data.selectedSaving !== undefined)   setSelectedSaving(data.selectedSaving);
        if (data.scenarios)                      setScenarios(data.scenarios);
        if (data.tuitionGoalTarget !== undefined) setTuitionGoalTarget(data.tuitionGoalTarget);
        if (data.tuitionSaved !== undefined)     setTuitionSaved(data.tuitionSaved);
        if (data._savedAt)                       setLastSaved(data._savedAt);
      }
      setLoaded(true);
    });
  }, []);

  const getDataToSave = () => ({
    grossSalary, netSalary, monthlyExpenses,
    schoolName, tuitionPerTerm, busPerTerm, termsPerYear,
    subsidies, selectedSaving, scenarios,
    tuitionGoalTarget, tuitionSaved,
    _savedAt: new Date().toLocaleString('th-TH'),
  });

  const handleSave = async () => {
    setSaving(true);
    const ok = await cloudSave(getDataToSave());
    setSaving(false);
    const now = new Date().toLocaleString('th-TH');
    setLastSaved(now);
    showToast(ok
      ? (FIREBASE_READY ? '☁️ บันทึกออนไลน์เรียบร้อย!' : '💾 บันทึกในเครื่องเรียบร้อย!')
      : '❌ บันทึกไม่สำเร็จ กรุณาลองใหม่');
  };

  const handleReset = () => {
    if (!window.confirm('รีเซ็ตข้อมูลทั้งหมดกลับเป็นค่าเริ่มต้น?')) return;
    setGrossSalary(DEFAULTS.grossSalary);
    setNetSalary(DEFAULTS.netSalary);
    setMonthlyExpenses(DEFAULTS.monthlyExpenses);
    setSchoolName(DEFAULTS.schoolName);
    setTuitionPerTerm(DEFAULTS.tuitionPerTerm);
    setBusPerTerm(DEFAULTS.busPerTerm);
    setTermsPerYear(DEFAULTS.termsPerYear);
    setSubsidies(DEFAULTS.subsidies);
    setSelectedSaving(DEFAULTS.selectedSaving);
    setScenarios(DEFAULTS.scenarios);
    setTuitionGoalTarget(DEFAULTS.tuitionGoalTarget);
    setTuitionSaved(DEFAULTS.tuitionSaved);
    showToast('🔄 รีเซ็ตข้อมูลแล้ว');
  };

  const copyReport = () => {
    const text = [
      '=== สรุปแผนการเงินคุณจิ๊บ ===',
      `เงินเดือนสุทธิ: ฿${netSalary.toLocaleString()}`,
      `ค่าใช้จ่ายรายเดือน: ฿${totalExp.toLocaleString()}`,
      `โรงเรียน: ${schoolName}`,
      `ค่าเทอมสุทธิ/ปี: ฿${netTuitionYr.toLocaleString()} (เฉลี่ย ฿${Math.round(netTuitionYr/12).toLocaleString()}/เดือน)`,
      `แผนออม: ฿${selectedSaving.toLocaleString()}/เดือน (฿${annualSavings.toLocaleString()}/ปี)`,
      `สถานะ: ${isCovered ? '✅ ครอบคลุมแล้ว' : `❌ ขาดอีก ฿${Math.abs(surplus).toLocaleString()}`}`,
      `เงินเหลือส่วนตัว: ฿${remaining.toLocaleString()}/เดือน`,
    ].join('\n');
    navigator.clipboard.writeText(text).then(
      () => showToast('📋 คัดลอกรายงานแล้ว!'),
      () => showToast('❌ คัดลอกไม่ได้ในเบราว์เซอร์นี้')
    );
  };

  // ── Calculations ──
  const totalExp        = useMemo(() => monthlyExpenses.reduce((s,i)=>s+i.amount,0), [monthlyExpenses]);
  const totalSchoolYr   = useMemo(() => (tuitionPerTerm+busPerTerm)*termsPerYear, [tuitionPerTerm,busPerTerm,termsPerYear]);
  const totalSubYr      = useMemo(() => subsidies.reduce((s,i)=>s+i.amount,0), [subsidies]);
  const netTuitionYr    = useMemo(() => Math.max(totalSchoolYr-totalSubYr,0), [totalSchoolYr,totalSubYr]);
  const annualSavings   = selectedSaving * 12;
  const isCovered       = annualSavings >= netTuitionYr;
  const surplus         = annualSavings - netTuitionYr;
  const remaining       = netSalary - totalExp - selectedSaving;
  const goalPct         = tuitionGoalTarget > 0 ? Math.min((tuitionSaved/tuitionGoalTarget)*100, 100) : 0;
  const goalRem         = Math.max(tuitionGoalTarget - tuitionSaved, 0);
  const goalReached     = goalRem <= 0 && tuitionGoalTarget > 0;
  const monthsToGoal    = selectedSaving > 0 ? Math.ceil(goalRem/selectedSaving) : null;

  const remColor = remaining >= 10000 ? 'text-emerald-700' : remaining > 0 ? 'text-amber-700' : 'text-rose-700';
  const remBg    = remaining >= 10000 ? 'bg-emerald-50 border-emerald-200' : remaining > 0 ? 'bg-amber-50 border-amber-200' : 'bg-rose-50 border-rose-200';

  if (!loaded) return (
    <div className="flex flex-col items-center justify-center min-h-screen gap-4 bg-slate-50">
      <div className="text-5xl animate-spin">⏳</div>
      <p className="text-slate-500 font-medium">กำลังโหลดข้อมูล{FIREBASE_READY ? 'จากคลาวด์' : ''}...</p>
    </div>
  );

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800" style={{fontFamily:"'Sarabun',sans-serif"}}>
      <Toast msg={toast} />

      {/* ── HEADER ── */}
      <header className="bg-gradient-to-r from-emerald-600 via-teal-700 to-indigo-800 text-white shadow-xl">
        <div className="max-w-6xl mx-auto px-4 py-5 sm:px-6">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <div className="flex flex-wrap gap-2 mb-1.5">
                <span className="bg-emerald-500/30 border border-emerald-400/20 text-emerald-200 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">วางแผนการเงิน</span>
                <span className="bg-indigo-500/30 border border-indigo-400/20 text-indigo-200 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">สำหรับบุตรหลาน</span>
                <span className={`${FIREBASE_READY?'bg-emerald-400/20 border-emerald-400/20 text-emerald-200':'bg-amber-400/20 border-amber-400/20 text-amber-200'} border text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider`}>
                  {FIREBASE_READY ? '☁️ ออนไลน์' : '💾 ออฟไลน์'}
                </span>
              </div>
              <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight flex items-center gap-2">
                💰 แดชบอร์ดค่าใช้จ่าย & วางแผนค่าเทอม คุณจิ๊บ
              </h1>
              <p className="text-emerald-100 text-xs mt-1 max-w-xl">
                สำหรับ <strong className="underline decoration-wavy decoration-emerald-300">{schoolName}</strong>
                {lastSaved && <span className="ml-2 text-emerald-300/70">· บันทึกล่าสุด: {lastSaved}</span>}
              </p>
            </div>
            <div className="flex flex-wrap gap-2">
              <button onClick={handleSave} disabled={saving}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-white/15 hover:bg-white/25 backdrop-blur border border-white/20 active:scale-95 transition-all rounded-xl text-sm font-bold text-white disabled:opacity-60 shadow-md">
                {saving ? '⏳ กำลังบันทึก...' : `${FIREBASE_READY?'☁️':'💾'} บันทึกข้อมูล`}
              </button>
              <button onClick={copyReport}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-emerald-500 hover:bg-emerald-400 active:scale-95 transition-all rounded-xl text-sm font-bold text-white shadow-md">
                📋 คัดลอกสรุป
              </button>
              <button onClick={handleReset}
                className="inline-flex items-center gap-1.5 px-4 py-2.5 bg-slate-700/50 hover:bg-slate-700/80 active:scale-95 transition-all rounded-xl text-sm font-bold border border-slate-600 text-white">
                🔄 รีเซ็ต
              </button>
            </div>
          </div>
        </div>
      </header>

      <main className="max-w-6xl mx-auto px-4 py-5 sm:px-6 space-y-5">

        <SetupBanner />

        {/* ── SUMMARY CARDS ── */}
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
          {/* Card 1 */}
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex items-center justify-between gap-2">
            <div>
              <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">เงินเดือนสุทธิ</span>
              <span className="text-xl sm:text-2xl font-extrabold text-slate-900 block mt-0.5">฿{netSalary.toLocaleString()}</span>
              <span className="text-[10px] text-slate-400">จาก ฿{grossSalary.toLocaleString()}</span>
            </div>
            <div className="p-2.5 bg-emerald-50 rounded-xl text-emerald-600 flex-shrink-0">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            </div>
          </div>
          {/* Card 2 */}
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex items-center justify-between gap-2">
            <div>
              <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">ค่าใช้จ่าย/เดือน</span>
              <span className="text-xl sm:text-2xl font-extrabold text-rose-600 block mt-0.5">฿{totalExp.toLocaleString()}</span>
              <span className="text-[10px] text-slate-400">{monthlyExpenses.length} รายการ</span>
            </div>
            <div className="p-2.5 bg-rose-50 rounded-xl text-rose-500 flex-shrink-0">
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            </div>
          </div>
          {/* Card 3 */}
          <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex items-center justify-between gap-2">
            <div>
              <span className="text-[10px] text-slate-500 font-semibold uppercase tracking-wider block">ค่าเทอมสุทธิ/ปี</span>

                      <th className="py-2.5 px-3 font-bold text-center">ความครอบคลุม</th>
                      <th className="py-2.5 px-3 font-bold text-center">ส่วนต่าง</th>
                      <th className="py-2.5 px-3 rounded-r-lg font-bold text-right">เหลือใช้/เดือน</th>
                    </tr>
                  </thead>
                  <tbody>
                    {scenarios.sort((a,b) => a-b).map(val => {
                      const yrS = val * 12;
                      const cov = yrS >= netTuitionYr;
                      const surp = yrS - netTuitionYr;
                      const rem = netSalary - totalExp - val;
                      const isAct = selectedSaving === val;
                      return (
                        <tr key={val} onClick={() => setSelectedSaving(val)}
                          className={`border-b border-slate-100 cursor-pointer transition-all hover:bg-slate-50/80 ${isAct ? 'bg-emerald-50/40 font-semibold border-l-4 border-l-emerald-500' : ''}`}>
                          <td className="py-2.5 px-3">
                            <span className="flex items-center gap-1.5">
                              {isAct && <span className="text-emerald-600 font-extrabold text-[10px]">▶</span>}
                              ฿{val.toLocaleString()}
                            </span>
                          </td>
                          <td className="py-2.5 px-3 text-center">฿{yrS.toLocaleString()}</td>
                          <td className="py-2.5 px-3 text-center">
                            {cov
                              ? <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-bold text-[10px]">✓ ครอบคลุม</span>
                              : <span className="bg-rose-100 text-rose-800 px-2 py-0.5 rounded-full font-bold text-[10px]">ขาด</span>}
                          </td>
                          <td className={`py-2.5 px-3 text-center font-bold ${surp >= 0 ? 'text-emerald-600' : 'text-rose-500'}`}>
                            {surp >= 0 ? '+' : ''}฿{surp.toLocaleString()}
                          </td>
                          <td className={`py-2.5 px-3 text-right font-black ${rem >= 5000 ? 'text-slate-800' : 'text-rose-600'}`}>
                            ฿{rem.toLocaleString()}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              <p className="text-[10px] text-slate-400 mt-2 italic text-center">* คลิกแถวเพื่อเลือกแผน</p>
            </div>

          </div>
        </div>

        {/* ── SAVE REMINDER BAR ── */}
        <div className="bg-gradient-to-r from-indigo-50 to-emerald-50 border border-indigo-100 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-3">
          <div className="flex items-start sm:items-center gap-3">
            <span className="text-2xl flex-shrink-0">{FIREBASE_READY ? '☁️' : '💾'}</span>
            <div>
              <p className="text-sm font-bold text-indigo-800">{FIREBASE_READY ? 'บันทึกออนไลน์' : 'บันทึกในเครื่อง'}</p>
              <p className="text-xs text-indigo-600">แก้ไขข้อมูลแล้ว? กด "บันทึกข้อมูล" เพื่อเซฟ
                {lastSaved && <span className="ml-1 text-indigo-400">· บันทึกล่าสุด: {lastSaved}</span>}
              </p>
            </div>
          </div>
          <button onClick={handleSave} disabled={saving}
            className="flex-shrink-0 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white text-sm font-bold px-6 py-2.5 rounded-xl transition-all disabled:opacity-60 shadow-md shadow-indigo-200">
            {saving ? '⏳ กำลังบันทึก...' : `${FIREBASE_READY ? '☁️' : '💾'} บันทึกข้อมูล`}
          </button>
        </div>

      </main>

      {/* ── FOOTER ── */}
      <footer className="bg-slate-900 text-slate-400 text-xs py-6 mt-6 border-t border-slate-800">
        <div className="max-w-6xl mx-auto px-4 text-center space-y-2">
          <p className="font-semibold text-slate-300">📊 แดชบอร์ดสรุปค่าใช้จ่าย & วางแผนค่าเทอม สำหรับครอบครัว</p>
          <p>สูตร: <code className="text-indigo-400 bg-slate-800 px-1.5 py-0.5 rounded">เงินเดือนสุทธิ − ค่าใช้จ่ายส่วนตัว − ออมค่าเทอม = เงินเหลือใช้จ่ายส่วนตัว</code></p>
          <p className="text-[11px] text-slate-500">
            {FIREBASE_READY
              ? '☁️ ข้อมูลบันทึกออนไลน์ผ่าน Firebase · สามารถเข้าถึงได้ทุกอุปกรณ์'
              : '⚠️ โหมดออฟไลน์ · ข้อมูลบันทึกในเบราว์เซอร์นี้เท่านั้น · ตั้งค่า Firebase เพื่อบันทึกออนไลน์'}
          </p>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
